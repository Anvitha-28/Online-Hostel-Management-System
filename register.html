<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register Student - HostelEase</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-r from-green-100 to-blue-100 min-h-screen">

  <!-- Navbar -->
  <nav class="bg-purple-700 text-white px-6 py-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold">🏠 HostelEase - Register Student</h1>
    <button onclick="location.href='admin-dashboard.html'" class="bg-white text-purple-700 font-bold px-4 py-2 rounded-full">Back</button>
  </nav>

  <!-- Registration Form -->
  <div class="p-6 flex flex-col items-center">
    <h2 class="text-2xl font-bold text-gray-700 mb-6">Add New Student</h2>

    <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md">
      <form onsubmit="registerStudent(event)" class="flex flex-col space-y-4">
        <input id="name" type="text" placeholder="Enter Student Name" required
               class="w-full p-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-400">
        <input id="id" type="text" placeholder="Enter Student ID" required
               class="w-full p-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-400">
        <button type="submit" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-full">
          ➕ Register Student
        </button>
      </form>
    </div>
  </div>

  <script>
    function registerStudent(event) {
      event.preventDefault();
      const name = document.getElementById('name').value.trim();
      const id = document.getElementById('id').value.trim();
      if (name && id) {
        const student = { name, id, room: "", feePaid: 0 };
        localStorage.setItem(`student-${id}`, JSON.stringify(student));
        alert("Student Registered Successfully!");
        document.getElementById('name').value = '';
        document.getElementById('id').value = '';
      }
    }
  </script>

</body>
</html>
