<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fee Management - HostelEase</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-r from-green-100 to-blue-100 min-h-screen">

  <!-- Navbar -->
  <nav class="bg-purple-700 text-white px-6 py-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold">💰 HostelEase - Fee Management</h1>
    <button onclick="location.href='admin-dashboard.html'" class="bg-white text-purple-700 font-bold px-4 py-2 rounded-full">Back</button>
  </nav>

  <!-- Fee Submission Form -->
  <div class="p-6 flex flex-col items-center">
    <h2 class="text-2xl font-bold text-gray-700 mb-6">Submit Fee for Student</h2>

    <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md">
      <form onsubmit="submitFee(event)" class="flex flex-col space-y-4">
        <input id="feeId" type="text" placeholder="Enter Student ID" required
               class="w-full p-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-400">
        <input id="amount" type="number" placeholder="Enter Amount (₹)" required
               class="w-full p-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-400">
        <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-full">
          💵 Submit Fee
        </button>
      </form>
    </div>
  </div>

  <script>
    function submitFee(event) {
      event.preventDefault();
      const id = document.getElementById('feeId').value.trim();
      const amount = parseInt(document.getElementById('amount').value.trim());
      const student = JSON.parse(localStorage.getItem(`student-${id}`));
      if (student) {
        student.feePaid = (student.feePaid || 0) + amount;
        localStorage.setItem(`student-${id}`, JSON.stringify(student));
        alert("Fee Submitted Successfully!");
        document.getElementById('feeId').value = '';
        document.getElementById('amount').value = '';
      } else {
        alert("Student ID not found!");
      }
    }
  </script>

</body>
</html>
